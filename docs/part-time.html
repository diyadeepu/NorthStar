<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NorthStar | Part-Time Applications</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="brand">
            <span class="brand-dot"></span>
            NorthStar
        </div>
        <ul class="nav-links">
            <li><a href="internships.html">Internships</a></li>
            <li><a href="part-time.html" class="active">Part-Time Jobs</a></li>
            <li><a href="scholarships.html">Scholarships</a></li>
            <li><a href="opportunities.html">Upcoming Radar</a></li>
        </ul>
    </nav>
    <main>
        <header>
            <h1>Part-Time Applications</h1>
            <p>Active pipeline for campus positions, research, and part-time roles</p>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Role & Organization</th>
                        <th>Deadline</th>
                        <th>Status</th>
                        <th>Notes / Next Steps</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="4">Loading applications...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        fetch('tracker.json')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById('table-body');
                tbody.innerHTML = '';
                const items = (data.items || []).filter(item => item.category === 'part_time');

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4">No part-time applications tracked yet.</td></tr>';
                    return;
                }

                items.forEach(item => {
                    const row = document.createElement('tr');
                    const badgeClass = `badge-${item.status.toLowerCase()}`;
                    row.innerHTML = `
                        <td><strong>${item.title}</strong><br><span style="color: var(--text-muted); font-size: 0.85rem;">${item.company}</span></td>
                        <td>${item.deadline}</td>
                        <td><span class="badge ${badgeClass}">${item.status}</span></td>
                        <td>${item.notes || '—'}</td>
                    `;
                    tbody.appendChild(row);
                });
            })
            .catch(err => {
                document.getElementById('table-body').innerHTML = '<tr><td colspan="4">Error loading tracker data. Run main.py to generate tracker.json.</td></tr>';
            });
    </script>
</body>
</html>
